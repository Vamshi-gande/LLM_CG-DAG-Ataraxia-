model:
  default: llama3.2:3b
  quality_eval: llama2:7b
  ollama_base_url: http://localhost:11434

embedding:
  model: all-MiniLM-L6-v2
  device: cpu
  dimension: 384
  onnx_model_path: models/all-MiniLM-L6-v2/model.onnx
  tokenizer_path: models/all-MiniLM-L6-v2/tokenizer.json

hnsw:
  M: 16
  ef_construction: 200
  ef_search: 50
  space: cosine
  max_elements: 100000
  rebuild_threshold_ratio: 0.10

propagation:
  seed_k: 10
  damping_factor: 0.6
  hop_limit: 3
  activation_threshold: 0.05
  edge_type_damping_multipliers:
    Causal: 1.0
    Dependency: 1.0
    Hierarchical: 0.85
    Temporal: 0.8
    Reinforces: 0.9
    Semantic: 0.6
    Contradicts: 0.2

graph:
  max_nodes_in_memory: 100000
  cold_storage_threshold_days: 7
  cold_storage_min_access: 3

propagation:
  seed_k: 10
  damping_factor: 0.6
  hop_limit: 3
  activation_threshold: 0.05

priority:
  weights:
    usage_frequency: 0.5
    semantic_centrality: 0.3
    freshness: 0.2
  freshness_decay_lambda: 0.1
  decay_per_query: 0.999
  activation_boost: 0.05

context:
  tier1_budget_tokens: 200
  tier2_budget_tokens: 800
  chars_per_token: 3.5
  max_candidates: 50

merge:
  similarity_threshold: 0.95
  min_age_hours: 24
  min_access_count: 1

bypass:
  min_nodes: 20
  min_turns: 10
  logic: AND

compression:
  semantic_merge_interval_min: 5
  edge_prune_interval_min: 10
  hierarchical_interval_min: 15
  temporal_compress_interval_min: 30
  global_summary_interval_min: 60
  global_summary_update_threshold: 0.20

summary:
  assistant_role: "a coding assistant"
  min_nodes_before_generation: 15

pagerank:
  incremental_interval_min: 30
