[pytest]
testpaths = tests
asyncio_mode = auto
addopts =
    -v
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:data/coverage
    -p no:warnings

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: fast, no IO, no Ollama
    integration: requires Ollama running at localhost:11434
    benchmark: long-running performance tests
    slow: skip in normal dev cycle
